services:
  app:
    build: .
    container_name: ci4_app
    restart: unless-stopped
    environment:
      - CI_ENVIRONMENT=development
    volumes:
      - .:/var/www/html
    
  web:
    image: nginx:alpine
    container_name: ci4_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mariadb:10.11
    container_name: ci4_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dani1234
      MYSQL_DATABASE: ci4_db
      MYSQL_USER: dani
      MYSQL_PASSWORD: ci4pass

    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
